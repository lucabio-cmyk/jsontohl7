[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hl7mw"
version = "0.1.0"
description = "Middleware HL7v2 order-driven tra LIS e strumenti di laboratorio (emocromo)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []   # core a zero dipendenze (solo stdlib)

[project.optional-dependencies]
dev = ["pytest>=8"]
api = ["fastapi>=0.100", "uvicorn>=0.23"]
# Finestra nativa dell'applicazione desktop (hl7mw/desktop.py). Su Windows usa
# WebView2/Edge. Se manca, l'app ricade su una finestra "applicazione" di
# Edge/Chrome e infine sul browser di sistema: e' un extra, non un requisito.
desktop = ["pywebview>=5"]
build = ["pyinstaller>=6.0", "pyinstaller-hooks-contrib"]

[project.scripts]
hl7mw = "hl7mw.run:main"
hl7mw-desktop = "hl7mw.desktop:main"

[tool.setuptools.packages.find]
# Auto-discovery (non un elenco statico "packages = [...]"): un elenco statico
# includeva solo "hl7mw" e non i sottopacchetti (es. hl7mw.adapters), invisibile
# con un editable install (espone comunque l'intero albero sorgente) ma con un
# install normale mancava "hl7mw.adapters" -> ModuleNotFoundError a runtime.
include = ["hl7mw*"]

[tool.setuptools.package-data]
# Chart.js vendorizzato per la dashboard (hl7mw/api.py): niente CDN esterno,
# vedi hl7mw/static/README.md
hl7mw = ["static/*.js"]
