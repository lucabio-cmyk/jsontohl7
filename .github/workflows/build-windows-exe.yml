name: Build Windows exe

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Installazione NON editable (niente "-e"): un editable install (PEP 660)
          # espone il pacchetto tramite un import hook custom invece che come
          # normali file su disco sotto site-packages. PyInstaller lo importa
          # correttamente in fase di build ma la sua analisi statica non riesce
          # a risalire ai sottomoduli reali per impacchettarli nell'exe --
          # fallisce a runtime con "ModuleNotFoundError: No module named 'hl7mw.run'"
          # pur avendo compilato senza errori.
          pip install ".[api,desktop]"
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build eseguibile
        run: |
          # --windowed: l'applicazione ha una finestra propria (hl7mw/desktop.py),
          # niente console alle spalle. Gli errori fatali dell'avvio arrivano
          # all'utente come finestra di dialogo, non come traccia in una console
          # che si chiude da sola.
          pyinstaller --onefile --windowed --name hl7mw-middleware --clean `
            --add-data "hl7mw/static/chart.umd.min.js;hl7mw/static" `
            --collect-submodules webview `
            packaging/win/hl7mw_entry.py

      - name: Smoke test (avvio reale del servizio + interfaccia)
        run: |
          # --selftest avvia tutto (MLLP, dashboard) in una cartella dati
          # temporanea, verifica che l'interfaccia risponda ed esce: prende
          # anche gli errori di impacchettamento che un --help non vedrebbe.
          # Start-Process -Wait: un eseguibile "windowed" non blocca la shell,
          # quindi $LASTEXITCODE non sarebbe il suo codice di uscita.
          $dataDir = "$env:RUNNER_TEMP\hl7mw-selftest"
          $p = Start-Process -FilePath ".\dist\hl7mw-middleware.exe" `
                 -ArgumentList "--selftest","--data-dir",$dataDir -Wait -PassThru
          Get-Content "$dataDir\hl7mw.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
          if ($p.ExitCode -ne 0) { throw "selftest fallito (exit $($p.ExitCode))" }

      - name: Copia config di esempio nel pacchetto
        run: Copy-Item config.example.json dist\config.example.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hl7mw-middleware-windows
          path: |
            dist/hl7mw-middleware.exe
            dist/config.example.json
          retention-days: 30
