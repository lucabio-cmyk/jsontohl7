name: Build Windows exe

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Installazione NON editable (niente "-e"): un editable install (PEP 660)
          # espone il pacchetto tramite un import hook custom invece che come
          # normali file su disco sotto site-packages. PyInstaller lo importa
          # correttamente in fase di build ma la sua analisi statica non riesce
          # a risalire ai sottomoduli reali per impacchettarli nell'exe --
          # fallisce a runtime con "ModuleNotFoundError: No module named 'hl7mw.run'"
          # pur avendo compilato senza errori.
          pip install ".[api]"
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build eseguibile
        run: |
          pyinstaller --onefile --name hl7mw-middleware --clean `
            --add-data "hl7mw/static/chart.umd.min.js;hl7mw/static" `
            packaging/win/hl7mw_entry.py

      - name: Smoke test (avvio + --help)
        run: |
          .\dist\hl7mw-middleware.exe --help

      - name: Copia config di esempio nel pacchetto
        run: Copy-Item config.example.json dist\config.example.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hl7mw-middleware-windows
          path: |
            dist/hl7mw-middleware.exe
            dist/config.example.json
          retention-days: 30
